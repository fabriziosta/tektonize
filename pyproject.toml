[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tektonize"
version = "0.1.0"
description = "Convert Jenkins shared-library Groovy to incomplete Tekton tasks and pipeline fragments"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-groovy>=0.1",
    "click>=8.0",
    "black>=24.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
tektonize = "tektonize.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/tektonize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["tektonize"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["tektonize"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
